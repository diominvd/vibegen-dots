general {
    gaps_in             = 10
    gaps_out            = 20
    border_size         = 4
    col.active_border   = $bg_alt
    col.inactive_border = $bg   
    layout              = dwindle
}

decoration {
    rounding            = 0
    active_opacity      = 1.0
    inactive_opacity    = 1.0
    fullscreen_opacity  = 1.0

    blur {
        enabled         = false
    }

    shadow {
        enabled         = true
        range           = 20
        render_power    = 8
        color           = rgba(00000066)
        color_inactive  = rgba(00000022)
    }
}
