# -----------------------------------------------------
# Layer Rules
# -----------------------------------------------------
layerrule {
    name = screenshot
    no_anim = on
    match:namespace = selection
}

# -----------------------------------------------------
# Window Rules
# -----------------------------------------------------

# Music Player
windowrule {
    name        = music-player
    match:class = ^(music_player)$
    workspace   = special:minimized silent
    float       = on
    size        = 800 600
    move        = center
}

# Thunar File Operations
windowrule {
    name        = file-progress
    match:title = ^(File Operation Progress)$
    match:class = ^(thunar)$
    float       = on
    size        = 480 180
    move        = 1420 60
    pin         = on
}

# Thunar Rename Dialog
windowrule {
    name        = thunar-rename
    match:class = ^(thunar)$
    match:title = ^(Rename.*)$
    float       = on
    center      = on
}

# Image Viewer (imv)
windowrule {
    name        = imv
    match:class = ^(imv)$
    no_dim      = on
    float       = on
    size        = 1000 600
    center      = on
}
