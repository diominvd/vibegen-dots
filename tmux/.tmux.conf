# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================
# Change prefix from C-b to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Quality of Life
set -g mouse on
set -g base-index 1                # Start windows at 1
setw -g pane-base-index 1          # Start panes at 1
set -g renumber-windows on         # Renumber windows when one is closed
set -g history-limit 10000         # Increase scrollback buffer

# IMPORTANT: Fix for your request
# Don't switch to another active session when current one is destroyed
set -g detach-on-destroy off

# ==============================================================================
# KEYBINDINGS
# ==============================================================================
# Reload config
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Sessions
bind S new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind-key -n M-q kill-session       # Alt+q to kill
bind-key -n M-w choose-tree -s      # Alt+w to switch between sessions

# Splitting Panes (using current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Movement (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing Panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick Window Switching (Alt + Number) - WINDOWS/TABS
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Quick Session Switching (Ctrl+Alt + Number) - SESSIONS
bind-key -n C-M-1 switch-client -t 1
bind-key -n C-M-2 switch-client -t 2
bind-key -n C-M-3 switch-client -t 3
bind-key -n C-M-4 switch-client -t 4
bind-key -n C-M-5 switch-client -t 5
bind-key -n C-M-6 switch-client -t 6
bind-key -n C-M-7 switch-client -t 7
bind-key -n C-M-8 switch-client -t 8
bind-key -n C-M-9 switch-client -t 9

# ==============================================================================
# APPEARANCE
# ==============================================================================
# Basic status bar settings
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left

# Colors: transparent background (default), text from terminal
set -g status-style "bg=default,fg=colour7"

# Left side: Session and Window
set -g status-left-length 40
set -g status-left "#[fg=colour0,bg=colour4,bold] #S #[fg=colour4,bg=colour8]#[fg=colour7,bg=colour8] #I:#P #[fg=colour8,bg=default]"

# Right side: Date and time
set -g status-right-length 80
set -g status-right "#[fg=colour8,bg=default]#[fg=colour7,bg=colour8] %H:%M #[fg=colour4,bg=colour8]#[fg=colour0,bg=colour4,bold] %d-%b "

# Window format (tabs)
set -g window-status-format "#[fg=default,bg=colour8]#[fg=colour7,bg=colour8] #I #W #[fg=colour8,bg=default]"
set -g window-status-current-format "#[fg=default,bg=colour2]#[fg=colour0,bg=colour2,bold] #I #W #[fg=colour2,bg=default]"

# Separator between windows
set -g window-status-separator ""

# Additional settings
set -g status-left-style NONE
set -g status-right-style NONE
