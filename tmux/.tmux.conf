# -----------------------------------------------------
# General Settings
# -----------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse              on
set -g base-index         1
setw -g pane-base-index   1
set -g renumber-windows   on
set -g history-limit      10000
set -g detach-on-destroy  off

# -----------------------------------------------------
# Keybindings
# -----------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Sessions
bind S new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind-key -n M-q kill-session
bind-key -n M-w choose-tree -s

# Splitting Panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------
# Quick Switching (Alt/Ctrl-Alt + Num)
# -----------------------------------------------------
# Windows
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Sessions
bind-key -n C-M-1 switch-client -t 1
bind-key -n C-M-2 switch-client -t 2
bind-key -n C-M-3 switch-client -t 3
bind-key -n C-M-4 switch-client -t 4
bind-key -n C-M-5 switch-client -t 5
bind-key -n C-M-6 switch-client -t 6
bind-key -n C-M-7 switch-client -t 7
bind-key -n C-M-8 switch-client -t 8
bind-key -n C-M-9 switch-client -t 9

# -----------------------------------------------------
# Appearance (Status Bar)
# -----------------------------------------------------
set -g status           on
set -g status-interval  1
set -g status-position  bottom
set -g status-justify   left
set -g status-style     "bg=default,fg=colour7"

set -g status-left-length 40
set -g status-left        "#[fg=colour0,bg=colour4,bold] #S #[fg=colour4,bg=colour8]#[fg=colour7,bg=colour8] #I:#P #[fg=colour8,bg=default]"

set -g status-right-length 80
set -g status-right        "#[fg=colour8,bg=default]#[fg=colour7,bg=colour8] %H:%M #[fg=colour4,bg=colour8]#[fg=colour0,bg=colour4,bold] %d-%b "

# -----------------------------------------------------
# Window Tabs Format
# -----------------------------------------------------
setw -g window-status-format         "#[fg=default,bg=colour8]#[fg=colour7,bg=colour8] #I #W #[fg=colour8,bg=default]"
setw -g window-status-current-format "#[fg=default,bg=colour2]#[fg=colour0,bg=colour2,bold] #I #W #[fg=colour2,bg=default]"
setw -g window-status-separator      ""

set -g status-left-style  NONE
set -g status-right-style NONE
