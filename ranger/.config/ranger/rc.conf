# ===================================================================
# RANGER CONFIGURATION
# ===================================================================

# Version Control System settings (Replaces the obsolete 'vcs_enabled')
set vcs_aware true
# Specify which VCS backend to use; enabled for Git specifically
set vcs_backend_git enabled

# Layout settings: proportions of the three columns (left, middle, right)
set column_ratios 1,3,4

# Show files starting with a dot (.) by default
set show_hidden true

# Ask for confirmation before deleting multiple files at once
set confirm_on_delete multiple

# Draw borders around columns for better visual separation
set draw_borders both

# Use a unicode ellipsis (...) instead of '~' when filenames are too long
set unicode_ellipsis true

# Set the default line mode to 'devicons' (requires ranger-devicons plugin)
default_linemode devicons

# ===================================================================
# PREVIEW SETTINGS
# ===================================================================

# Path to the external preview script
set preview_script ~/.config/ranger/scope.sh

# Use the external preview script to generate previews for files
set use_preview_script true
